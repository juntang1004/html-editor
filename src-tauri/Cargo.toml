[package]
name = "html-slide-studio"
version = "0.3.0"
edition = "2024"
description = "HTML presentation editor for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rfd = "0.15"
dunce = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

