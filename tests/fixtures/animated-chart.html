<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Animation fixture</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; }
.slide { position: relative; width: 1280px; height: 720px; background: #fff; }
h1 { position: absolute; left: 80px; top: 30px; margin: 0; font-size: 44px; }
#body { position: absolute; left: 80px; top: 110px; margin: 0; font-size: 24px; width: 500px; }
#chart { position: absolute; left: 640px; top: 120px; width: 560px; height: 420px; }
#rule-bar { position: absolute; left: 80px; top: 420px; width: 400px; height: 30px; background: #16a34a; }
#inline-dot { position: absolute; left: 80px; top: 480px; width: 40px; height: 40px; border-radius: 50%; background: #f59e0b; }
#slow-bar { position: absolute; left: 80px; top: 540px; width: 300px; height: 30px; background: #7c3aed; }
.play .grow { animation: grow .2s ease both; }
.play .slow { animation-duration: 2s; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
</style></head><body>
<section class="slide">
 <h1 id="title">GLP-1 효과 요약</h1>
 <p id="body">체중 변화 비교 그래프</p>
 <svg id="chart" viewBox="0 0 560 420" aria-label="막대 그래프">
  <g class="chart-axes" stroke="#334155" fill="none"><path id="axis-path" d="M60 20 V300 H540"/></g>
  <g class="tick-labels" fill="#334155" font-size="16"><text id="label-y" x="20" y="30">10</text><text x="30" y="305">0</text><text x="20" y="400">-5</text></g>
  <rect class="bar" x="100" y="150" width="60" height="150" fill="#2563eb"/>
  <rect class="bar" x="220" y="90" width="60" height="210" fill="#2563eb"/>
  <rect class="bar" id="neg-bar" x="340" y="300" width="60" height="70" fill="#e11d48"/>
  <path id="trend" d="M130 140 C200 100 300 120 370 80" stroke="#f59e0b" stroke-width="4" fill="none"/>
 </svg>
 <div id="rule-bar" class="grow"></div>
 <div id="inline-dot" style="animation: appear .2s ease both"></div>
 <div id="slow-bar" class="grow slow"></div>
</section>
<section class="slide"><h1>두 번째 슬라이드</h1><p id="second">마지막</p></section>
</body></html>
