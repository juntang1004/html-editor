<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Regression fixture</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; }
.slide { position: relative; width: 1280px; height: 720px; background: #fff; }
h1 { position: absolute; left: 80px; top: 40px; margin: 0; font-size: 48px; }
p { position: absolute; margin: 0; width: 300px; height: 80px; padding: 16px; font-size: 28px; }
#alpha { left: 100px; top: 200px; background: #dbeafe; }
#beta { left: 500px; top: 200px; background: #dcfce7; }
#gamma { left: 100px; top: 200px; background: #fef3c7; }
</style></head><body>
<section class="slide"><h1>First fixture slide</h1><p id="alpha">Alpha object</p><p id="beta">Beta object</p></section>
<section class="slide"><h1>Second fixture slide</h1><p id="gamma">Gamma object</p></section>
</body></html>
