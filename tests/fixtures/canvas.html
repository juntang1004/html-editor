<!doctype html>
<html><head><meta charset="utf-8"><title>Canvas fixture</title>
<style>body{margin:0}.slide{position:relative;width:1280px;height:720px;background:#fff}#chart{position:absolute;left:100px;top:100px;width:200px;height:100px;border:2px solid #333}</style></head>
<body><section class="slide"><h1>Canvas slide</h1><canvas id="chart" width="200" height="100"></canvas></section>
<script>const c=document.getElementById('chart').getContext('2d');c.fillStyle='rgb(255,0,0)';c.fillRect(0,0,200,100);</script></body></html>
